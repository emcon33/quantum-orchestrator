# Default values for quantum-orchestrator.

replicaCount: 1

image:
  repository: ghcr.io/quantum-orchestrator/operator
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  # AWS IRSA (for Braket)
  # eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/quantum-orchestrator
  # Azure Workload Identity (for Azure Quantum)
  # azure.workload.identity/client-id: <client-id>

rbac:
  create: true

# Transpiler sidecar
transpiler:
  enabled: true
  image:
    repository: ghcr.io/quantum-orchestrator/transpiler
    tag: "0.1.0"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# OpenShift configuration
openshift:
  # Enable OpenShift Console Plugin
  consolePlugin:
    enabled: false
    # routePath: /
  # Enable OLM bundle (for OperatorHub)
  olm:
    enabled: false
    # packageManifest: quantum-orchestrator
  # GPU Operator (NVIDIA)
  gpuOperator:
    nvidia:
      enabled: true
      # MIG mode for multi-tenant GPU partitioning
      mig: false
    amd:
      enabled: false
      # ROCm for AMD MI355X
      rocm: false
  # RDMA for NVQLink / QEC interconnect
  rdma:
    enabled: false
    # Multus NetworkAttachmentDefinition name
    networkAttachment: nvqlink-rdma
  # Node Feature Discovery
  nodeFeatureDiscovery:
    enabled: true

# IBM Cloud configuration (for IBM Quantum workloads)
ibm:
  # Region: us-east (default, supports Open Plan) or eu-south
  region: us-east
  # Instance CRN (from IBM Cloud dashboard)
  # instanceCRN: "crn:v1:bluemix:quantum-compute:us-east:12345678:instance:abc123"

# NVIDIA NGC configuration (for CUDA-Q / cuQuantum workloads)
ngc:
  # NGC registry pull secret (create with: kubectl create secret docker-registry)
  imagePullSecret: ngc-pull-secret
  # NGC image tag: cu13-0.16.0 (stable), cu12-0.14.2, cu13-latest (nightly)
  imageTag: cu13-0.16.0

# GPU configuration (for NVIDIA CUDA-Q / cuQuantum workloads)
gpu:
  enabled: false
  # Node selector for GPU nodes
  nodeSelector:
    nvidia.com/gpu.present: "true"
  # Default GPU model
  model: a100
  # Default GPU count per job
  count: 1
  # NVIDIA GPU Operator / Device Plugin required
  # See: https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/

# Metrics
metrics:
  enabled: true
  port: 8080

# Health probes
health:
  port: 8081

# Leader election (for HA)
leaderElection:
  enabled: false
  id: "quantum-orchestrator.leader"

# Resource limits for the operator
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Node selector, tolerations, affinity
nodeSelector: {}
tolerations: []
affinity: {}

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Prometheus service monitor (for Prometheus Operator)
serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

# OpenTelemetry
otel:
  enabled: false
  endpoint: ""
  headers: {}

# Log level: debug, info, warn, error
logLevel: info
