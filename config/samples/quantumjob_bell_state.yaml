# Bell state preparation on AWS Braket SV1 simulator
apiVersion: quantum.orchestrator.io/v1alpha1
kind: QuantumJob
metadata:
  name: bell-state
  labels:
    app.kubernetes.io/part-of: quantum-orchestrator
    example: bell-state
spec:
  circuit:
    inline: |
      OPENQASM 3.0;
      include "stdgates.inc";
      qubit[2] q;
      bit[2] c;
      h q[0];
      cx q[0], q[1];
      measure q[0] -> c[0];
      measure q[1] -> c[1];
    format: openqasm3
  target:
    provider: aws-braket
    device: sv1
    simulator: true
  shots: 1024
  credential:
    secretRef:
      name: braket-creds
      key: credentials
  scheduling:
    queue: default
    priorityClass: high
    preemption: LowerPriority
    retries: 3
  result:
    backend: s3
    bucket: my-quantum-results
    prefix: bell-state/
