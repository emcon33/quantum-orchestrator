# IBM Quantum processor backends
---
apiVersion: quantum.orchestrator.io/v1alpha1
kind: QPUBackend
metadata:
  name: ibm-nighthawk-r2
  labels:
    provider: ibm
    processor: nighthawk
    revision: r2
spec:
  provider: ibm
  deviceId: ibm_nighthawk_r2
  qubits: 120
  gateSet: ["H", "CX", "RZ", "RX", "RY", "X", "Y", "Z", "I", "S", "T", "TOFFOLI"]
  errorRates:
    gate: 0.001
    readout: 0.003
    t1: 100.0
    t2: 60.0
  availability: on-demand
  cost:
    billing: per-use
    unitCost: 0.0
    currency: USD
  dashboardUrl: "https://quantum.cloud.ibm.com"
