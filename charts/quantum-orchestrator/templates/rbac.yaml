{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "quantum-orchestrator.fullname" . }}
  labels:
    {{- include "quantum-orchestrator.labels" . | nindent 4 }}
rules:
  # Quantum Orchestrator CRDs
  - apiGroups: ["quantum.orchestrator.io"]
    resources: ["quantumjobs", "quantumsessions", "qpubackends", "quantumproviderbindings", "quantumsimulators"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["quantum.orchestrator.io"]
    resources: ["quantumjobs/status", "quantumsessions/status", "qpubackends/status", "quantumproviderbindings/status", "quantumsimulators/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["quantum.orchestrator.io"]
    resources: ["quantumjobs/finalizers", "quantumsessions/finalizers"]
    verbs: ["update"]
  # Core K8s
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "services", "pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  # Workloads (for hybrid jobs)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Kueue
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["clusterqueues", "localqueues", "resourceflavors"]
    verbs: ["get", "list", "watch"]
  # Coordination (leader election)
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "quantum-orchestrator.fullname" . }}
  labels:
    {{- include "quantum-orchestrator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "quantum-orchestrator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "quantum-orchestrator.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
