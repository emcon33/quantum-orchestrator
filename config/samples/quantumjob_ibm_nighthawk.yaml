# VQE on IBM Quantum Nighthawk r2 (120Q, square lattice, high-speed reset)
# Nighthawk r2: 120 programmable + 458 physical qubits
# 218+ tunable couplers, 30% more circuit depth vs Heron
apiVersion: quantum.orchestrator.io/v1alpha1
kind: QuantumJob
metadata:
  name: vqe-nighthawk
  labels:
    provider: ibm
    processor: nighthawk
spec:
  circuit:
    inline: |
      OPENQASM 3.0;
      include "stdgates.inc";
      qubit[4] q;
      bit[4] c;
      // H2 molecule VQE ansatz (4 qubits)
      x q[0];
      rx(theta[0]) q[0];
      rx(theta[1]) q[1];
      cx q[0], q[1];
      rz(theta[2]) q[1];
      cx q[0], q[1];
      rx(theta[3]) q[2];
      rx(theta[4]) q[3];
      cx q[2], q[3];
      rz(theta[5]) q[3];
      cx q[2], q[3];
      measure q[0] -> c[0];
      measure q[1] -> c[1];
      measure q[2] -> c[2];
      measure q[3] -> c[3];
    format: openqasm3
  target:
    provider: ibm
    device: ibm_nighthawk_r2
  shots: 8192
  parameters:
    theta[0]: "0.5"
    theta[1]: "0.3"
    theta[2]: "0.7"
    theta[3]: "0.2"
    theta[4]: "0.4"
    theta[5]: "0.6"
  credential:
    secretRef:
      name: ibm-quantum-creds
      key: token
  ibm:
    processor: nighthawk
    revision: r2
    qiskit:
      version: "2.5"
      compilationMode: standard
      useCAPI: true
      dynamicCircuits: true
      presetPassManager: v2
    errorMitigation:
      strategy: zero-noise
      hpcPowered: true
      readoutMitigation: true
      extrapolationOrders: [1, 2, 3, 4]
  result:
    backend: s3
    bucket: my-quantum-results
    prefix: vqe-nighthawk/
