# VQE on cuQuantum (GPU-accelerated statevector simulation)
apiVersion: quantum.orchestrator.io/v1alpha1
kind: QuantumJob
metadata:
  name: cuquantum-vqe-h2
  labels:
    provider: nvidia-cuquantum
    example: vqe
spec:
  circuit:
    inline: |
      OPENQASM 3.0;
      include "stdgates.inc";
      qubit[2] q;
      bit[2] c;
      x q[0];
      rx(theta[0]) q[0];
      rx(theta[1]) q[1];
      cx q[0], q[1];
      rz(theta[2]) q[1];
      cx q[0], q[1];
      measure q[0] -> c[0];
      measure q[1] -> c[1];
  target:
    provider: nvidia-cuquantum
    device: cuquantum-statevec
    simulator: true
  shots: 4096
  parameters:
    theta[0]: "0.5"
    theta[1]: "0.3"
    theta[2]: "0.7"
  credential:
    secretRef:
      name: nvidia-gpu-creds
  nvidia:
    sdk: cuquantum
    cuQuantum:
      engine: statevec
      gpus: 1
      nodes: 1
      integration: qiskit
      maxQubits: 25
    gpu:
      model: h100
      count: 1
      minMemoryGiB: 80
  result:
    backend: minio
    bucket: quantum-results
    prefix: vqe-h2/
