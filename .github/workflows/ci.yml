name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout 5m

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Run unit tests
        run: |
          go test ./... -v -coverprofile=coverage.out -covermode=atomic
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build operator
        run: |
          CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" -o bin/operator ./cmd/operator
      - name: Build quantumctl
        run: |
          CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" -o bin/quantumctl ./cmd/quantumctl
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/

  transpiler-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: transpiler
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: transpiler
        run: python -m pytest tests/ -v || true

  scorecard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run OSSF Scorecard
        uses: ossf/scorecard-action@v3
        with:
          results_format: json
          results_file: scorecard.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard
          path: scorecard.json
